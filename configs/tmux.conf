# xfcemlg — tmux.conf (Graphite-Amber rice)
# Prefix stays Ctrl+b (deliberate). base-index 1, vi keys, mouse on.

set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g mouse on
set -g escape-time 0
setw -g mode-keys vi
set -g focus-events on
set -g default-terminal "screen-256color"

# reload: Ctrl+b r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Graphite-Amber aesthetics (palette: bg #16181D / base #202329, accent #E8A33D) ---
set -g status-style "bg=#202329,fg=#D8D3C8"
set -g status-left "#[bg=#E8A33D,fg=#16181D,bold] #S "
set -g status-right "#[bg=#202329,fg=#9A9AA2] %a %d %b %H:%M "
setw -g window-status-current-style "fg=#E8A33D,bold"
setw -g window-status-style "fg=#9A9AA2"
set -g pane-border-style "fg=#30343B"
set -g pane-active-border-style "fg=#E8A33D"
set -g message-style "bg=#E8A33D,fg=#16181D"
set -g message-command-style "bg=#202329,fg=#D8D3C8"