# devuan-xfce-setup — tmux.conf (Darkmatter rice)
# Prefix stays Ctrl+b (deliberate). base-index 1, vi keys, mouse on.

set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g mouse on
set -g escape-time 0
setw -g mode-keys vi
set -g focus-events on
set -g default-terminal "screen-256color"

# reload: Ctrl+b r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Darkmatter aesthetics (palette: bg #121113 / base #1c1b1d, accent #e75353) ---
set -g status-style "bg=#1c1b1d,fg=#ffffff"
set -g status-left "#[bg=#e75353,fg=#121113,bold] #S "
set -g status-right "#[bg=#1c1b1d,fg=#999999] %a %d %b %H:%M "
setw -g window-status-current-style "fg=#e75353,bold"
setw -g window-status-style "fg=#999999"
set -g pane-border-style "fg=#2b2b2b"
set -g pane-active-border-style "fg=#e75353"
set -g message-style "bg=#e75353,fg=#121113"
set -g message-command-style "bg=#1c1b1d,fg=#ffffff"