# alacritty.toml — Graphite-Amber palette (near-black, amber accent)
# Seed for 21-theme.sh. TOML is the only config format alacritty 0.13+ reads.

[window]
decorations = "Full"
opacity = 1.0
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10.0

[terminal]
# Alacritty joins (or creates) the tmux "main" session on launch; falls
# back to a plain interactive bash if tmux is not installed.
shell = { program = "/bin/bash", args = ["-lc", "command -v tmux >/dev/null 2>&1 && exec tmux new -A -s main || exec bash"] }

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#16181D"
foreground = "#D8D3C8"

[colors.normal]
black   = "#16181D"
red     = "#E8A33D"
green   = "#79A9A6"
yellow  = "#D2992F"
blue    = "#9A9AA2"
magenta = "#E8A33D"
cyan    = "#D2992F"
white   = "#D8D3C8"

[colors.bright]
black   = "#30343B"
red     = "#E8A33D"
green   = "#79A9A6"
yellow  = "#D2992F"
blue    = "#9A9AA2"
magenta = "#E8A33D"
cyan    = "#D2992F"
white   = "#D8D3C8"

[colors.cursor]
text = "#16181D"
cursor = "#E8A33D"

[colors.selection]
text = "#D8D3C8"
background = "#202329"